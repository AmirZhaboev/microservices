apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      initContainers:
        - name: wait-for-vault
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://vault.microservices.svc.cluster.local:8200/v1/sys/health; do
                echo "Waiting for vault..."
                sleep 3
              done
      containers:
        - name: config-server
          image: config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8071
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "git,vault"
            - name: VAULT_CONFIG_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-config-server-token
                  key: token
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: microservices
spec:
  selector:
    app: config-server
  ports:
    - port: 8071
      targetPort: 8071
